# Open office with two doors. People walk mid-aisle, keep right where they
# meet head-on, and a robot vacuum takes right-angle aisles to its dock.
scene: office
bounds: { width: 8, depth: 6, height: 3 }
minGap: 0.1
openings:
  door:  { wall: south, at: 1.2, width: 1 }
  side:  { wall: east, at: 4.5, width: 0.9 }
agents:
  robot: { radius: 0.18, height: 0.1 }
objects:
  desk:    { size: [1.4, 0.7, 0.75], count: 4 }
  table:   { size: [2.4, 1.1, 0.75] }
  cabinet: { size: [1.2, 0.45, 1.8], count: 2 }
  dock:    { size: [0.4, 0.3, 0.12] }
  plant:   { size: [0.5, 0.5, 1.3] }
relations:
  - desk distribute evenly along wall north, gap 0.4
  - table center-of room
  - cabinet1 and cabinet2 distribute evenly along wall west, gap 0.3, facing east
  - dock corner se
  - plant corner ne
  - keep clear 1.2 between table and desk1
paths:
  - person from door to desk3
  - person from desk2 to door
  - person from side to desk1
  - person from cabinet2 to side
  - robot from dock to cabinet1, orthogonal
