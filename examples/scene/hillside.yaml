# A hillside site: the ground is a 10 m grid of elevations (synthetic
# here; a DEM exported as an ESRI ASCII grid reads the same way). Objects
# on the floor stand on the ground. The solar panels lean with the slope.
# The turbines have no place given, only limits: ground no steeper than
# 8° and at least 1425 m up, so the solver puts them on the ridge, 30 m
# apart. Lamps stand evenly along the access road (5 m wide), 4 m to its right; a
# survey drone flies across the ridge 60 m above the ground.
